services:
  fake-sms-provider:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      SMS_SERVICE_WEBHOOK_URL: ${SMS_SERVICE_WEBHOOK_URL:-http://snippen-sms-service:3000/webhook/sms}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
